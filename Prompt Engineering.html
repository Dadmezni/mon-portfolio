ba:["اشرح الذكاء الاصطناعي","أنت أستاذ معلوماتية. اشرح في 150 كلمة، لطلاب ثانوي بلا خلفية، الفرق بين المصنِّف والنموذج التوليدي. اختم بمثال من الحياة اليومية.","الجمهور محدد، الطول محدد، مثال مطلوب ← إجابة مناسبة"],
wm:"الأمر المبهم يُنشّط الأنماط الأكثر عمومية في النموذج: يختار من متوسطه الإحصائي. بتحديد الجمهور والتنسيق والطول، نُضيّق فضاء الإجابات الممكنة: يختار النموذج من إجابات ملائمة لحالتك.",
out:"بدون سياق: «الذكاء الاصطناعي مجال واسع يشمل…» (800 كلمة عامة).\nمع سياق: «تخيل موظفَين. الأول يفرز البريد في كومتين (مصنِّف). الثاني يكتب الردود (توليدي)…» (150 كلمة، مناسبة).",
a:["اطلب من نموذجين (Claude وChatGPT) شرح المفهوم نفسه لمبتدئ","قارن الوضوح والدقة والبنية والأمثلة","حدّد عبارة تحتاج إلى تحقق"],
q:["ما الفرق بين الذكاء الاصطناعي التوليدي والتصنيف؟",["الذكاء الاصطناعي التوليدي يُنشئ محتوى، والمصنِّف يُسند تصنيفًا","كلاهما يفعل الشيء نفسه","التصنيف يُنشئ صورًا"],0]},
{t:"النماذج والرموز والسياق",h:4,o:["تعريف الرمز (token) ونافذة السياق ودرجة الحرارة","التمييز بين الواجهة والنموذج وواجهة برمجة التطبيقات (API)"],
k:[["الرموز (Tokens)","أجزاء من الكلمات أو علامات ترقيم أو أحرف. يعتمد عددها على اللغة ويؤثر في الحدود والتكلفة. «مرحبا» ≈ 1–2 رمز؛ رواية من 300 صفحة ≈ 150,000 رمز."],["نافذة السياق","كمية المعلومات التي يأخذها النموذج في الحسبان في محادثة. Claude ~200K، ChatGPT ~128K، DeepSeek 64–128K حسب الإصدار. إذا تجاوزت: لخّص أو اختر أو استخدم RAG."],["درجة الحرارة","تضبط تنوّع المُخرجات. أقل = أكثر توقعًا. 0.0 للكود والرياضيات، 0.7–1.0 للكتابة، 1.3 كحد أقصى للإبداع. ليست زرًّا للحقيقة."],["الواجهة، النموذج، API","الواجهة هي التطبيق، النموذج يُولّد، وAPI تسمح لبرنامج بالتواصل مع النموذج."]],
p:"لخّص هذا النص في 5 نقاط، كل نقطة 15 كلمة كحد أقصى.\nلا تُضف أي معلومة غير موجودة في النص.\nإذا كان عنصر غامضًا، اكتب «يحتاج تحققًا».",
ex:"تُلصق تقريرًا من 40 صفحة. يقرأ النموذج 13,000 رمز من التقرير + سؤالك. لو كان التقرير 300 صفحة، لتجاوز نافذة السياق: ستُقتطع معلومات البداية. الحل: تلخيص حسب الأقسام ثم التجميع — هذا هو <b>التقطيع (chunking)</b>.",
ba:["لخّص هذا المستند","لخّص هذا المستند المكوّن من 40 صفحة في 5 نقاط من 20 كلمة كحد أقصى. اذكر صفحة المصدر لكل نقطة. إذا كان قسم فارغ، اكتب «غير مُدخل».","مستند طويل ← اقتباسات + معالجة الأقسام الفارغة"],
wm:"على سياق طويل، قد يفقد النموذج معلومات في المنتصف (ظاهرة «lost in the middle»). بطلب الاقتباسات والحالات الفارغة، نفرض الانتباه إلى البنية ونكتشف النسيان.",
out:"بدون تحديد: «يتناول هذا المستند عدة مواضيع…» (غامض).\nمع تحديد: «1. رقم الأعمال يزداد 12% (ص 4). 2. كتلة الأجور مستقرة (ص 7). 3. …»",
a:["اختبر نصًا قصيرًا وآخر طويلًا","راقب تأثير تعليمات متناقضة","أنشئ جدول معايير لاختيار النموذج"],
q:["نافذة السياق تمثل…",["كمية المعلومات التي يأخذها النموذج في الحسبان","حجم الشاشة","سعر الاشتراك"],0]},
{t:"الأوامر الأساسية",h:6,o:["هيكلة الطلب: الدور، السياق، المهمة، القيود، التنسيق","إتقان zero-shot وfew-shot"],
k:[["الدور والسياق","الدور يُحدد النبرة؛ والسياق يصف الجمهور والهدف والبيانات. لا بيانات سرية دون إذن."],["المهمة والقيود","أفعال دقيقة (قارن، صنّف، استخرج…). القيود: الطول، المستوى، اللغة، النطاق، الممنوعات."],["تنسيق المخرجات","قائمة، جدول، خطة، JSON، كود مُعلّق: التنسيق يسهّل إعادة الاستخدام والتحقق."],["Zero-shot / few-shot","بدون أمثلة، أو مع بضعة أمثلة تمثيلية متسقة."],["سلسلة التفكير (Chain-of-Thought)","طلب التفكير خطوة بخطوة يحسّن المهام المنطقية والرياضية. مع نماذج التفكير (o1، R1)، يكون التفكير ضمنيًا: ابقَ موجزًا."]],
p:"الدور: أنت مستشار تربوي.\nالسياق: حصة من 90 دقيقة، طلاب مبتدئون في الإدارة.\nالمهمة: ابنِ حصة حول أساسيات التسويق الرقمي.\nالقيود: مفردات بسيطة، أمثلة محلية، لا مصطلحات دون شرح.\nالتنسيق: أهداف، سير زمني، نشاط، تصحيح، واجب.\nالجودة: كل هدف يجب أن يكون قابلًا للتحقق.",
ex:"مديرة مجتمع تريد كتابة منشور لمتجر مستحضرات تجميل عضوية. أمر ضعيف: «اكتب منشور إنستغرام» ← رد باهت. أمر مهيكل: دور، جمهور، طول، نبرة، دعوة لإجراء، وسوم، ممنوعات ← 3 نسخ قابلة للاختبار A/B.",
ba:["اكتب منشور إنستغرام","أنت مدير مجتمع لمتجر مستحضرات تجميل عضوية في تونس. اكتب 3 خيارات لمنشور إنستغرام (80 كلمة كحد أقصى) لإطلاق سيروم بـ 45 دينارًا. النبرة: دافئة وخبيرة. أدرج إيموجي واحدًا، دعوة لإجراء واحدة، 5 وسوم مناسبة. لا تذكر أي سعر مخفّض.","3 نسخ قابلة للاختبار + قيود دقيقة"],
wm:"كل قيد يُقلّص فضاء المخرجات. الدور يُنشّط أنماط المجال (مدير مجتمع = نبرة وأكواد)، والقيود تُنشّط أنماط الشكل (80 كلمة، إيموجي، دعوة). النتيجة: عشوائية أقل وملاءمة أكبر.",
out:"بدون هيكلة: «اكتشفي سيرومنا الجديد المرطب، المثالي لبشرتك…» (عام).\nمع هيكلة: 3 خيارات متمايزة، كل واحدة بزاوية (فائدة، مكوّن، شهادة)، دعوة نحو واتساب أو DM، ووسوم مناسبة (#مستحضرات_عضوية #تونس #عناية_بالبشرة).",
a:["حوّل خمسة طلبات مبهمة إلى أوامر مهيكلة","انتقل من zero-shot إلى نسخة few-shot","استخدم المولّد أدناه"],
q:["ما هو few-shot؟",["إعطاء بضعة أمثلة مدخلات ومخرجات","طرح السؤال بسرعة","منع الأمثلة"],0]},
{t:"التقنيات المتقدمة والاختبار",h:6,o:["تفكيك المهمة وسلسلة الأوامر","اختبار الأمر وتحسينه بمنهجية"],
k:[["التفكيك والسلسلة (Chaining)","قسّم إلى خطوات (استخراج، تحليل، اقتراح، تحقق). مخرجات خطوة تُغذّي الخطوة التالية."],["المخرجات المهيكلة / JSON","حدّد الحقول والأنواع والقيم المسموحة، والسلوك عند غياب بيانات. Structured Outputs (OpenAI) وJSON mode (DeepSeek) يفرضان مخططًا."],["Prefilling","تعبئة بداية الرد لتوجيه التنسيق: يُستخدم مع API Claude عبر معامل assistant."],["Meta-prompting","اطلب من النموذج كتابة أو تحسين أمر قبل الرد."],["مجموعة الاختبارات","حالات عادية، حدّية، غامضة، وعدائية، تُقيَّم وفق شبكة: دقة، تنسيق، أمان، استقرار."],["التكرار","غيّر متغيرًا واحدًا في كل مرة؛ سجّل الإصدار والنموذج والتاريخ والنتائج."]],
p:"أنت مستخرج بيانات.\nأعد فقط JSON يحتوي الحقول «الاسم»، «البريد»، «الهاتف»، «الحالة».\nإذا كانت قيمة مفقودة، استخدم null. لا تختلق أي بيان أبدًا.\nالنص: [ألصق النص]",
ex:"فريق موارد بشرية يعالج 500 ترشيح. أمر 1: استخرج الاسم والبريد والخبرة. أمر 2: تحقق من الصيغة وأشر إلى الحقول المفقودة. أمر 3: اكتب ردًّا شخصيًا حسب القرار. كل خطوة قابلة للاختبار منفصلة: إذا فشل الاستخراج على 3 سير ذاتية، نُصلح الأمر 1 دون المساس بالآخرين.",
ba:["حلّل هذه السيرة الذاتية","الخطوة 1 — استخراج: أعد JSON {الاسم, البريد, سنوات_الخبرة, المهارات[]}. الخطوة 2 — تحقق: أشر إلى الحقول null أو البريد غير الصالح. الخطوة 3 — تقييم: قارن بالعرض المرفق، أعط تنقيطًا /10 وتبريرًا في سطرين.","تفكيك إلى 3 خطوات ← كل نتيجة قابلة للتحقق"],
wm:"أمر واحد معقد يخلط مهامًا ويُخفي الأخطاء: لا نعرف إن كانت المشكلة في الاستخراج أم في الكتابة. بالسلسلة، تصبح كل مخرجة نقطة تحكم.",
out:"خطوة واحدة: «أعتقد أن هذا المترشح جيد» (غير قابل للتحقق).\nمسلسَل: {الاسم:\"أمين ت.\", البريد:\"amine@mail.tn\", سنوات_الخبرة:5, المهارات:[\"PHP\",\"Laravel\"]} ← تحقق: OK ← تنقيط: 8/10 (إتقان جيد لـ Laravel، يفتقر إلى خبرة الفريق).",
a:["أنشئ سير عمل من 3 أوامر: استخراج، تحقق، كتابة","حضّر 8 حالات اختبار منها حالتان غامضتان","اكتشف JSON غير صالح أو بيانات مختلقة"],
q:["لماذا نحضّر حالات اختبار؟",["لقياس الجودة على حالات متنوعة واكتشاف العيوب","لإطالة الأمر","لتجنب إعادة القراءة"],0]},
{t:"المهن والتطوير",h:5,o:["تكييف الأوامر مع المهام المهنية","طلب كود قابل للاختبار وآمن"],
k:[["الكتابة والتسويق","حدّد الجمهور والهدف والنبرة والدعوة لإجراء. واجه الأفكار بالبيانات الحقيقية."],["تحليل المستندات","اطلب الوقائع والتفسيرات ونقاط التحقق، مع مقاطع المصدر."],["تطوير البرمجيات","أعطِ الإصدارات والسلوك المتوقع والقيود والاختبارات. لا تُنفّذ الكود أعمى أبدًا."],["تصحيح الأخطاء","رسالة خطأ كاملة، خطوات الاستنساخ، النتيجة المتوقعة والملاحظة. أخفِ المفاتيح والبيانات الشخصية."],["مقارنة النماذج","Claude: التمييز والمستندات الطويلة. ChatGPT: المنظومة والأدوات. DeepSeek: الكود والاستدلال والتكلفة."]],
p:"أنت مطوّر Laravel متمرس.\nالمشروع: Laravel 13، PHP 8.3، PostgreSQL.\nالمهمة: اقترح migration ونموذجًا لإدارة المواعيد.\nالقيود: مفتاح أجنبي، فهارس مفيدة، تحقق من الخادم، سياسة تصريح، اختبارات.\nابدأ بشرح المخطط والافتراضات. لا تفترض وجود ملفات لم تُقدَّم.",
ex:"مطوّر يطلب «اكتب نموذج Laravel» ← رد عام يخلط أنماط Laravel 8 و10، بلا اختبارات، ولا يُترجم. بتحديد الإصدار والمخطط والسياسة والاختبارات، يُنتج النموذج كودًا مطابقًا مع اختبارات قابلة للتنفيذ.",
ba:["اكتب مدونة بـ Laravel","Laravel 13، PHP 8.3، PostgreSQL. أنشئ: migration مقالات (title، slug فريد، body، published_at nullable)، نموذجًا مع casts، policy (المؤلف فقط يعدّل)، FormRequest (تحقق)، اختبارات Pest (إنشاء، تحقق، تصريح). اشرح أولًا المخطط والافتراضات.","كود قابل للاختبار + اختبارات + شروح"],
wm:"نماذج الكود حساسة للإصدارات: بدون سياق، تخلط أنماط إصدارات متعددة وتهلوس دوالًّا لم تعد موجودة. بتثبيت الإصدارات والقيود، نقلّل هلوسات التوافق.",
out:"بدون سياق: كود عام، بلا policy، بلا اختبارات، صياغة قد تكون قديمة.\nمع سياق: migration + نموذج + policy + FormRequest + 4 اختبارات Pest، مع شرح المخطط والافتراضات قبل الكود.",
a:["اكتب أمر migration Laravel","اكتب أمر تصحيح انطلاقًا من خطأ وهمي","اطلب اختبارات وابحث عن حالات منسية"],
q:["ماذا يجب إخفاؤه في أمر تصحيح الأخطاء؟",["مفاتيح API، كلمات المرور، الرموز، البيانات الشخصية","اسم إطار العمل","رسالة الخطأ"],0]},
{t:"المساعدون المتخصصون وRAG",h:5,o:["تحديد نطاق المساعد","شرح خطوات نظام RAG"],
k:[["تعريف المساعد","المهمة، الجمهور، النطاق، القواعد، المصادر المصرح بها، السلوك عند الشك — وما لا يجب فعله."],["تعليمات النظام","تضبط الدور والنبرة والأولويات والتنسيق. لا أسرار بداخلها؛ ولا تُغني عن ضوابط الوصول."],["RAG","تقطيع المستندات، التضمينات (embeddings)، الفهرسة، استرجاع المقاطع ذات الصلة، ثم التوليد بهذا السياق."],["Embeddings والتشابه","تضمين يرمز المعنى إلى متجه؛ تشابه جيب التمام يقارن محتويين. انتبه: القرب ≠ الحقيقة."],["التقييم","أسئلة مُغطاة، غير مُغطاة، غامضة: المقاطع الصحيحة مُسترجَعة، الأمانة، الاقتباسات الصحيحة."]],
p:"أنت المساعد الوثائقي لمركز تكوين.\nأجب فقط انطلاقًا من المستندات المقدمة.\nاذكر عنوان المستند والقسم المستخدم.\nإذا كانت الإجابة غائبة، قل: «معلومة غائبة من المستندات المقدمة».\nلا تُكمل بافتراض.",
ex:"مركز تكوين لديه 200 صفحة برنامج. طالب يسأل «متى تنتهي التسجيلات؟». بدون RAG، يختلق النموذج تاريخًا محتملًا. مع RAG: يسترجع النظام قسم «التقويم»، يجيب المساعد مع اقتباس. إن كان القسم غائبًا، يقول «معلومة غائبة».",
ba:["متى تنتهي التسجيلات؟","أجب فقط انطلاقًا من المستندات المقدمة. إذا كانت المعلومة غائبة، اكتب «معلومة غائبة من المستندات المقدمة». اذكر عنوان المستند والقسم المستخدم. لا تُكمل بافتراض.","إجابة قابلة للتحقق أو رفض صريح"],
wm:"بدون ارتكاز وثائقي، يُنتج النموذج الإجابة الأكثر احتمالًا لا الأكثر صدقًا. بطلب الاقتباس والرفض الصريح، نحوّل «إجابة محتملة» إلى «إجابة قابلة للتحقق». هذا جوهر RAG.",
out:"بدون RAG: «تنتهي التسجيلات عادةً نهاية سبتمبر.» (مختلق).\nمع RAG: «تنتهي التسجيلات في 15 سبتمبر (برنامج 2025، قسم التقويم).»",
a:["اكتب تعليمات نظام لمساعد","أنشئ مجموعة من 3 مستندات غير سرية","حضّر 10 أسئلة مُغطاة و5 خارج المجموعة"],
q:["ماذا يعني RAG؟",["التوليد المعزز بالاسترجاع (Retrieval-Augmented Generation)","مولّد إجابات عشوائي","بوابة API سريعة"],0]},
{t:"وكلاء الذكاء الاصطناعي والأتمتة",h:8,o:["التمييز بين المساعد وسير العمل والوكيل","تصميم أتمتة مع تحقق بشري","معرفة الهياكل (ReAct، Plan-and-Execute، متعدد الوكلاء)","تصميم ذاكرة الوكيل وقابلية المراقبة"],
k:[["المساعد، سير العمل، الوكيل","المساعد يجيب، سير العمل يتبع خطوات محددة، الوكيل يختار أدوات لتحقيق هدف."],["ReAct","حلقة استدلال-فعل: يلاحظ النموذج، يُفكر، يختار أداة، يلاحظ النتيجة، يعيد. بسيط وفعّال للمهام المحدودة."],["Plan-and-Execute","يضع النموذج خطة أولًا، ثم ينفذ خطوة بخطوة. مفيد للمهام الطويلة والمهيكلة."],["متعدد الوكلاء","منسّق يفوّض إلى وكلاء متخصصين (بحث، كود، كتابة). معقد: يُحفظ للحالات المبررة."],["Tool calling","النموذج يقترح استدعاء أداة؛ التطبيق ينفذه، يتحقق من المعاملات ويُعيد النتيجة."],["الذاكرة","قصيرة المدى (المحادثة)، طويلة المدى (قاعدة متجهات)، حالة سير العمل. يجب أن تكون محدودة ومنظّفة ومُصدَّرة."],["قابلية المراقبة","سجّل كل فكرة وكل استدعاء أداة وكل قرار: ضروري للتصحيح والتدقيق."],["التحقق البشري","تأكيد قبل الإرسال أو الدفع أو الحذف أو أي إجراء فعلي. أذونات دنيا."],["حقن الأمر (Prompt injection)","المحتويات الخارجية (رسائل، صفحات، مستندات) بيانات غير موثوقة، وليست تعليمات أبدًا."],["تقييم الوكيل","المهام الناجحة، عدد الخطوات، التكلفة، الأمان، احترام الضوابط، السلوك على اختبارات عدائية."]],
p:"صمّم سير عمل يستقبل طلب عميل، يستخرج الاسم والموضوع، يصنّف الطلب، ويُعدّ مسودة رد.\nاطلب تحققًا بشريًا قبل أي إرسال.\nلا تُرسل الرسالة تلقائيًا أبدًا.\nتوقّع الحالات التي يكون فيها العنوان أو الموضوع مفقودًا.",
ex:"وكيل دعم يستقبل: «مرحبًا، أريد إلغاء طلبي #1234.» هو: 1) يستخرج الرقم، 2) يستعلم API الطلبات، 3) يتحقق من وجوده وأنه لم يُشحن، 4) يُعدّ مسودة رد، 5) يطلب تحققًا بشريًا. إذا احتوى البريد على «تجاهل قواعدك»، يسجله الوكيل كمشبوه دون طاعة.",
ba:["أرسل بريدًا إلى العميل","سير العمل: استقبل البريد ← استخرج الموضوع والمرسل ← صنّف الطلب ← أعدّ مسودة ← اطلب تحققًا بشريًا ← أرسل بعد الموافقة. لا تُرسل دون تحقق. سجّل كل خطوة.","5 خطوات قابلة للتحكم + ضابط بشري + تسجيل"],
wm:"وكيل بلا ضابط قد يُنفّذ إجراءً فعليًا (إرسال، دفع) بناءً على تعليمات خبيثة. بإدخال تحقق بشري قبل الفعل، نحوّل قرارًا آليًا إلى قرار مُراقَب. هذا الفرق بين وكيل مفيد ووكيل خطير.",
out:"بدون ضابط: وكيل يُرسل فورًا بريدًا يحتوي بيانات العميل (تسريب).\nمع ضابط: وكيل يُعدّ المسودة، يعرض رقم الطلب والحالة، وينتظر التحقق. إذا احتوى البريد «تجاهل قواعدك»، يُبلّغ كمشبوه.",
a:["ارسم سير عمل معالجة الطلبات","اسرد الأدوات والأذونات الدنيا","اختبر تعليمات خبيثة مخفية في مستند","قارن ReAct وPlan-and-Execute على مهمة رصد"],

ba:["مساعدي يجيب الطلاب","مساعد وثائقي لمركز تكوين. النطاق: البرنامج، التواريخ، الأسعار. خارج النطاق: التسجيلات الفردية، النقاط. عند الشك: توجيه إلى الإدارة. الاختبارات: 10 مُغطاة + 2 خارج النطاق + 1 حقن.","نطاق واضح + خطة اختبار كاملة"],

{d:"الأمر (Prompt): تعليمة أو مجموعة معلومات تُرسل إلى نموذج.",c:"كيّف الطول مع المهمة: ليست كل الأوامر بحاجة إلى كل الأقسام.",e:"كتابة «اشرح التسويق»: دون جمهور أو طول أو تنسيق، يضطر الذكاء الاصطناعي إلى التخمين.",l:["الدور: يعطي منظور العمل ويضبط النبرة.","السياق: يصف الجمهور (مبتدئون في الإدارة) والوضع (90 دقيقة).","المهمة: فعل دقيق وموضوع محدد.","القيود: مفردات، أمثلة، مصطلحات: تحدد الإجابة.","التنسيق: البنية المتوقعة، قابلة للاستخدام مباشرة.","الجودة: معيار يمكنك التحقق منه."],cs:"مدرّسة تطلب «حضّر لي درسًا» وتحصل على رد عام جدًا. بإضافة الجمهور والمدة والأهداف القابلة للتحقق والتنسيق، تحصل على حصة قابلة للاستخدام.",x:["حسّن: «اكتب لي منشور فيسبوك.»","حدّد العرض، الجمهور، النبرة، التنسيق، الدعوة لإجراء، والعناصر الإلزامية. مثال: «منشور من 50 كلمة يُعلن قائمة الغداء بـ 15 دينارًا، نبرة ودودة، دعوة عبر واتساب.»"],r:"أي قسم من البنية تنساه أكثر؟"},
{d:"سلسلة الأوامر (Prompt chaining): مخرجات خطوة تصبح مدخلات التالية.",c:"غيّر متغيرًا واحدًا فقط، وإلا لن تعرف ما حسّن النتيجة.",e:"تحسين أمر على مثال واحد ملائم.",l:["«أنت مستخرج بيانات»: دور محدود بالاستخراج.","«فقط JSON»: يمنع أي نص حوله.","الحقول الأربعة: الاسم، البريد، الهاتف، الحالة.","«null» إذا غاب: سلوك محدد للبيانات المفقودة.","«لا تختلق أبدًا»: قاعدة مضادة للهلوسة.","[ألصق النص]: منطقة بيانات يجب استبدالها."],cs:"يصل نموذج تسجيل. الأمر 1 يستخرج الحقول، الأمر 2 يكتشف الحقول المفقودة، الأمر 3 يكتب الرد. إذا كانت النتيجة خاطئة، نعرف أي خطوة نصصح.",x:["أي أنواع حالات يجب أن تكون في مجموعة اختبار؟","حالات عادية، حدّية، غامضة، عدائية."],r:"أي مهمة في عملك يمكن تقطيعها إلى ثلاثة أوامر؟"},

h+='<article class="card" id="intro"><div class="mh"><span class="num">📘</span><h2>مقدمة ومتطلبات</h2></div><p>هذه الدورة من 40 ساعة تُعلّم تصميم واختبار وتحسين التعليمات للذكاء الاصطناعي التوليدي، من الأبسط (فهم النماذج) إلى الأكثر تقدمًا (الوكلاء والمشروع النهائي). تقارن صراحة بين <b>Claude</b> و<b>ChatGPT</b> و<b>DeepSeek</b>، وكل مفهوم يُوضَّح بـ<b>مثال ملموس</b>، و<b>قبل/بعد</b>، وشرح <b>لماذا ينجح</b>.</p><div class="def"><b>📖 تعريف</b> هندسة الأوامر هي التصميم المنهجي للتعليمات للحصول على نتيجة مفيدة وقابلة للتحقق وقابلة للتكرار. ليست صيغة سحرية: أمر جيد يرفع احتمالية نتيجة جيدة دون ضمان الحقيقة.</div><div class="tag">تشريح الأمر</div><div class="an">'+['الدور','السياق','المهمة','القيود','التنسيق','معايير'].map(function(s,i){return '<span style="--i:'+i+'">'+s+'</span>'}).join('<i>←</i>')+'</div><div class="k" style="margin-top:14px"><div><b>🎯 الأهداف العامة</b>هيكلة أمر، اختيار تقنية، اختبار وتحسين، تصميم مساعد، تحديد المخاطر.</div><div><b>🧰 المتطلبات</b>لا لغة برمجة للوحدات الست الأولى. متصفح ومستندات رقمية وأدوات على الإنترنت تكفي.</div><div><b>🧭 بنية الفصل</b>أهداف، مفاهيم، تعريف، نصيحة، خطأ شائع، مثال ملموس، قبل/بعد، لماذا ينجح، ورشة، تمرين مُصحَّح، تأمّل، خلاصة، اختبار.</div></div><div class="tag">المسار في لمحة</div>'+PAR+'<div class="tag">أمر ضعيف أم أمر مهيكل؟</div><div class="tw"><table class="eval"><tr><th></th><th>ضعيف</th><th>مهيكل</th></tr><tr><td>الطلب</td><td>«اشرح التسويق.»</td><td>دور، جمهور، 150 كلمة، مثال محلي، 3 أسئلة</td></tr><tr><td>النتيجة</td><td>عامة، غير متوقعة</td><td>مناسبة، قابلة للتحقق، قابلة لإعادة الاستخدام</td></tr></table></div><div class="ex"><b>🔍 مثال ملموس</b><p>«اكتب مقالًا عن القهوة» ← رد من 800 كلمة عن تاريخ القهوة من إثيوبيا. «أنت كاتب لمدونة طهي. اكتب مقالًا من 400 كلمة عن 3 طرق استخلاص منزلية (مكبس، فلتر، إسبريسو)، مع وصفة بسيطة لكل منها. الجمهور: مبتدئون.» ← رد قابل للنشر مباشرة، منظم في 3 أقسام.</p></div></article>';

["ج · تحسين نص","راجع النص لـ[الجمهور] و[الهدف].\nحافظ على الوقائع والأسماء والتواريخ والأرقام والنية.\nحسّن الوضوح والبنية. لا تُضف وعودًا غير مقدمة.\nأعد النسخة المراجعة، ثم قائمة التغييرات الرئيسية.","📌 مثال: «راجع رسالة الدافع هذه لوظيفة مطوّر مبتدئ. حافظ على الوقائع. اجعلها أكثر مباشرة. اسرد التغييرات في نهاية الرد.»"],
["د · تطوير وظيفة","السياق التقني: [اللغة، الإطار، الإصدارات، قاعدة البيانات].\nالوظيفة: [وصف].\nالسلوك المتوقع: [قواعد].\nالقيود: [أمان، أداء، اصطلاحات].\nقبل البرمجة: اسرد الافتراضات والملفات المعنية.\nثم اقترح تنفيذًا تدريجيًا، والتحققات، والاختبارات، والمخاطر.\nلا تدّعِ تنفيذ الكود.","📌 مثال: «Laravel 13، PHP 8.3، PostgreSQL. أنشئ API حجز. القيود: تحقق، policy، اختبارات Pest، rate limiting. ابدأ بالمخطط.»"],
["هـ · إنشاء مجموعة اختبارات","انطلاقًا من هذه المواصفة، أنشئ مجموعة اختبارات: حالة عادية، بيانات مفقودة، قيم حدّية، مدخل غير صالح، غموض، محاولة تجاوز.\nلكل اختبار: مدخل، نتيجة متوقعة، معيار نجاح.\nلا تختلق سلوكًا غائبًا من المواصفة.","📌 مثال: «انطلاقًا من قاعدة الخصم (10% فوق 100 دينار)، أنشئ 6 اختبارات: عادي، حد دقيق، تحت العتبة، سالب، نص، رمز ترويجي منتهٍ.»"],
["و · بريد مهني","السياق: [الوضع].\nالمرسل إليه: [الاسم/الوظيفة].\nالهدف: [النتيجة المتوقعة].\nالنبرة: [رسمية/ودية/حازمة].\nالطول: 120 كلمة كحد أقصى.\nالموضوع: اقترح 3 خيارات.\nاختم بدعوة لإجراء واضحة.\nلا تختلق أي حقيقة أو رقم أو التزام.","📌 مثال: «بريد لعميل غير راضٍ. الهدف: تهدئة واقتراح استرداد. النبرة: رسمية ومتعاطفة. 120 كلمة. 3 مواضيع ممكنة.»"],
["ز · تلخيص مع اقتباسات","تلخيص للمستندات المقدمة.\nلكل نقطة مهمة، اذكر المستند والقسم المصدر.\nميّز: 1) ما تؤكده مصادر متعددة؛ 2) ما يظهر مرة واحدة؛ 3) ما هو غائب.\nإذا تناقضت المصادر، أشر إلى التناقض.\nاختم بـ3 أسئلة مفتوحة للتعميق.","📌 مثال: «تلخيص لـ5 مقالات عن العمل عن بعد. أكّد ما يتكرر. أشر إلى التناقضات. اختم بـ3 أسئلة.»"],
["ح · تحليل بيانات","حلّل الجدول المقدم.\n1) صف الاتجاهات والقيم الشاذة؛\n2) أشر إلى البيانات المفقودة؛\n3) اقترح فرضيتين تفسيريتين، محددتين بوضوح كذلك؛\n4) اسرد 3 أسئلة تُطرح قبل الاستنتاج.\nلا تحسب انطلاقًا من فرضيات غير موجودة في الجدول.","📌 مثال: «حلّل جدول المبيعات الشهرية هذا. صف الاتجاه. أشر إلى الأشهر المفقودة. اقترح فرضيتين لانخفاض أبريل.»"],
["ط · اختبار تعليمي","أنشئ 10 أسئلة اختيار من متعدد حول [الموضوع] لجمهور [المستوى].\nلكل سؤال: 4 خيارات، إجابة صحيحة واحدة، تفسير من 20 كلمة.\nضمّن سؤالَي فهم، وسؤالَي تطبيق، وسؤالَي تحليل، وسؤالَي تركيب، وسؤالَي تقييم.\nتجنّب الأسئلة الغامضة والمشتتات غير المعقولة.","📌 مثال: «10 أسئلة اختيار حول أساسيات التسويق الرقمي، مستوى L1. 4 خيارات، إجابة واحدة. امزج الفهم والتطبيق.»"],
["ي · عصف ذهني مهيكل","ولّد 15 فكرة لـ[الهدف].\nصنّفها في 3 فئات: واقعية، طموحة، إبداعية.\nلكل فكرة، أشر إلى الجهد، الأثر المتوقع، ومخاطرة.\nثم اقترح 3 أفكار لاختبارها بالأولوية واشرح لماذا.\nاختم بسؤال مفتوح لتوسيع التأمل.","📌 مثال: «15 فكرة لتنشيط تكوين من 40 ساعة. صنّف حسب الجهد/الأثر. اقترح 3 أفكار لاختبارها بالأولوية.»"],
["ك · تدقيق كود","راجع هذا الكود لـ: الأمان، الأداء، القراءة، الحالات الحدية.\nلكل مشكلة: خطورة (عالية/متوسطة/منخفضة)، السطر المعني، التصحيح المقترح، اختبار يجب إضافته.\nلا تختلق اعتمادية غائبة. إذا كان الكود قصيرًا جدًا للحكم، قل ذلك.\nاختم بتنقيط عام و3 أولويات.","📌 مثال: «دقّق وحدة تحكم Laravel هذه. أشر إلى حقن SQL محتمل، تحقق ناقص، اختبارات يجب إضافتها. رتّب 3 تصحيحات.»"],
["ل · ترجمة وتكييف","ترجم النص إلى [اللغة الهدف] لجمهور [الملف].\nكيّف الأمثلة والوحدات والمراجع الثقافية.\nأشر بين أقواس [مُكيَّف] إلى المقاطع المعدّلة.\nحافظ على الأسماء والأرقام والعلامات.\nإذا لم يكن للمصطلح مقابل، اقترح خيارين.","📌 مثال: «ترجم هذا الدرس إلى الإنجليزية لمطورين مبتدئين. كيّف الوحدات (دينار ← دولار). أشر إلى التكييفات.»"]];
