<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلم Laravel خطوة بخطوة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf5;--paper:#fdfdfb;--line:#dbe3f2;--ink:#14235c;--txt:#2b3557;--blue:#1f3fa0;--green:#2e9e57;--orange:#ee8a1f;--purple:#6a3fb5;--red:#d6335b;--yel:#ffd93b;--note:#fff3a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1226;--paper:#182142;--line:#26325c;--ink:#dfe7ff;--txt:#c3cdee;--note:#6b5f1c}}
:root[data-theme="dark"]{--bg:#0c1226;--paper:#182142;--line:#26325c;--ink:#dfe7ff;--txt:#c3cdee;--note:#6b5f1c}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
header{text-align:center;padding:28px 16px 8px}
header h1{margin:0;color:var(--ink);font-size:clamp(24px,5vw,38px);font-weight:800}
header p{margin:4px 0 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg)}
nav a{flex:none;text-decoration:none;font-size:13px;font-weight:600;color:var(--ink);border:2px solid var(--blue);border-radius:99px;padding:2px 12px;background:var(--paper)}
nav a:focus-visible,nav a:hover{background:var(--yel);color:#14235c}
main{max-width:none;width:100%;margin:0;padding:8px 14px 40px;display:grid;gap:28px}
.page{position:relative;background:var(--paper);border-radius:10px;padding:22px 22px 18px 20px;padding-right:44px;box-shadow:0 2px 0 var(--line),0 10px 24px rgba(20,35,92,.12);background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
.page:before{content:"";position:absolute;top:10px;bottom:10px;right:10px;width:16px;background:radial-gradient(circle at 50% 50%,var(--ink) 0 4px,transparent 5px) 0 0/16px 26px repeat-y}
.brand{font-size:13px;font-weight:600;color:var(--blue)}
.page h2{margin:2px 0 0;color:var(--ink);font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.35;display:inline;background:linear-gradient(transparent 62%,var(--yel) 62% 92%,transparent 92%)}
.sub{margin:6px 0 14px;font-weight:600;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.blk{background:var(--paper);border:2px dashed var(--c);border-radius:12px;padding:12px 14px}
.blk h3{display:inline-block;margin:-26px 0 6px;padding:0 12px;background:var(--c);color:#fff;border-radius:6px;font-size:15px;font-weight:800;transform:rotate(-1deg)}
.blk ul,.blk ol{margin:0;padding:0 18px 0 0}
.blk li{margin:3px 0}
.blk li::marker{color:var(--c);font-weight:800}
.blk{margin-top:14px}
.note,.end{margin-top:14px;padding:10px 14px;border-radius:6px;font-weight:600}
.note{background:var(--note);color:var(--ink);transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.12);width:fit-content;max-width:100%}
.end{border:2px solid var(--blue);border-radius:12px;color:var(--ink)}
.end b{color:var(--blue)}
footer{text-align:center;padding:20px;font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:4px;z-index:9;background:linear-gradient(90deg,var(--blue),var(--yel));transform-origin:right;transform:scaleX(0)}
.hero{position:absolute;top:14px;left:16px;font-size:clamp(42px,9vw,64px);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.il{list-style:none;padding:0!important}
.il li{display:flex;gap:8px;align-items:flex-start}
.ib{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--paper));font-size:19px;transition:transform .25s}
.il li:hover .ib{transform:scale(1.25) rotate(-8deg)}
.flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 2px;margin-top:6px}
.st{flex:1 1 92px;min-width:92px;max-width:170px;text-align:center}
.ico{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 4px;border-radius:16px;background:color-mix(in srgb,var(--c) 14%,var(--paper));border:2px solid var(--c);font-size:36px;transition:transform .25s}
.st:hover .ico{transform:translateY(-4px) rotate(-6deg) scale(1.08)}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:800}
.st b{display:block;font-size:13px;line-height:1.4;color:var(--ink)}
.st small{display:block;font-size:11.5px;line-height:1.45}
.ar{align-self:center;margin-top:-30px;color:var(--c);font-style:normal;font-size:14px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-6px)}}
.js .page{opacity:0;transform:translateY(36px) rotate(.5deg);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .page.in{opacity:1;transform:none}
.js .page h2{background-repeat:no-repeat;background-size:0 100%;background-position:right;transition:background-size .9s .35s}
.js .page.in h2{background-size:100% 100%}
.js .blk{opacity:0;transform:translateY(22px) scale(.97);transition:opacity .5s,transform .5s;transition-delay:calc(var(--k)*90ms + 250ms)}
.js .in .blk{opacity:1;transform:none}
.js .st{opacity:0;transform:scale(.6);transition:opacity .4s,transform .45s cubic-bezier(.3,1.6,.5,1);transition-delay:calc(var(--i)*110ms + 500ms)}
.js .in .st{opacity:1;transform:none}
.js .in .note{animation:pop .8s 1s both}
@keyframes pop{0%{transform:rotate(-6deg) scale(.7);opacity:0}60%{transform:rotate(2deg) scale(1.05)}100%{transform:rotate(-.6deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.js .page,.js .blk,.js .st,.hero,.ar,.js .in .note{animation:none;transition:none;opacity:1;transform:none}.js .page h2{background-size:100% 100%}}
#art svg{width:min(760px,100%);height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 12px 24px rgba(20,35,92,.16))}
.nd{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.4)}}
.flowline{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:8px 0 0;font-weight:600;color:var(--ink)}
.flowline span{background:var(--paper);border:2px solid var(--blue);border-radius:99px;padding:0 12px}
.flowline i{color:var(--orange);font-style:normal}
nav a.on{background:var(--yel);color:#14235c;border-color:var(--orange)}
@media (min-width:900px){
html{scroll-padding-top:16px}
body{padding-right:250px}
nav{position:fixed;top:0;right:0;bottom:0;width:250px;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;gap:6px;padding:20px 14px;background:var(--paper);border-left:2px solid var(--line);z-index:7}
nav:before{content:"المواضيع";font-weight:800;color:var(--ink);font-size:18px;padding:0 4px 6px}
nav a{border-radius:10px;padding:4px 12px;border-width:2px;font-size:14px;transition:transform .2s}
nav a:hover{transform:translateX(-4px)}
}
@media (prefers-reduced-motion:reduce){.nd{animation:none}}

nav a{display:flex;align-items:center;gap:8px;white-space:nowrap}
nav a b{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800}
nav a.on b{background:var(--orange)}
nav a.home{border-style:dashed;justify-content:center}
@media (min-width:900px){
nav a{white-space:normal;line-height:1.4;padding:7px 12px;border-color:transparent;background:transparent}
nav a.on{border-color:var(--orange)}
nav a.home{border-color:var(--blue);margin-bottom:6px}
}
#bar{background-size:200% 100%;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.dig{margin-top:14px;border:2px solid var(--purple);border-radius:12px;background:var(--paper);overflow:hidden}
.dig summary{cursor:pointer;padding:8px 14px;font-weight:800;color:var(--purple);list-style:none;display:flex;align-items:center;gap:8px}
.dig summary::-webkit-details-marker{display:none}
.dig summary:after{content:"＋";margin-inline-start:auto;transition:transform .3s}
.dig[open] summary:after{transform:rotate(45deg)}
.dig p{margin:0;padding:4px 16px 12px;animation:dg .5s}
@keyframes dg{from{opacity:0;transform:translateY(-8px)}}
.js .in .blk:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 8px 18px rgba(20,35,92,.15)}
.st .ico{animation:gl 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*.45s)}
@keyframes gl{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}}
.flowline span{animation:fl 3s ease-in-out infinite}
.flowline span:nth-of-type(2){animation-delay:.5s}
.flowline span:nth-of-type(3){animation-delay:1s}
@keyframes fl{50%{background:var(--yel);color:#14235c;transform:translateY(-3px)}}
#top{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);background:var(--yel);color:#14235c;font-size:20px;cursor:pointer;z-index:8;opacity:0;pointer-events:none;transform:scale(.6);transition:.3s}
#top.show{opacity:1;pointer-events:auto;transform:none}
@media (prefers-reduced-motion:reduce){.st .ico,.flowline span,#bar,.dig p{animation:none}}
.dig ul{margin:0;padding:4px 34px 12px 16px;animation:dg .5s}
.dig li{margin:4px 0}
.dig li::marker{color:var(--purple)}
@media (prefers-reduced-motion:reduce){.dig ul{animation:none}}
.fg{margin:8px 16px 0}
.fg svg{width:min(460px,100%);display:block;margin:0 auto;overflow:visible}
.fi{animation:fi .6s both;animation-delay:var(--d)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.fa{stroke-dasharray:5 4;animation:da 1s linear infinite}
@keyframes da{to{stroke-dashoffset:-9}}
.sl{animation:sl 3s ease-in-out infinite}
@keyframes sl{0%,10%{transform:translate(0,0)}50%{transform:translate(64px,0)}90%,100%{transform:translate(64px,64px)}}
@media (prefers-reduced-motion:reduce){.fi,.fa,.sl{animation:none}}
code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:color-mix(in srgb,var(--blue) 12%,var(--paper));border-radius:6px;padding:1px 6px;word-break:break-word}

["لماذا يحبه المطورون؟",G,["صياغة واضحة ومقروءة","توثيق ممتاز ومجتمع كبير","أداة Artisan توفر الوقت","منظومة متكاملة: Livewire وInertia وSanctum"]],
["ماذا تبني به؟",O,["مواقع ومتاجر إلكترونية","لوحات تحكم وأنظمة إدارة","واجهات API للتطبيقات","أنظمة حجز وخدمات SaaS"]],
["كيف يخدم الطلب؟",P,["الطلب (Request) يصل","المسار (Route) يحدد الوجهة","المتحكم (Controller) ينفذ المنطق","النموذج (Model) يجلب البيانات","العرض (View) ينتج الصفحة"],1]],
"Laravel لا يغني عن PHP جيد: كلما أتقنت الأساسيات فهمت الإطار أسرع.","يمنحك Laravel هيكلًا جاهزًا لتركز على فكرة مشروعك لا على التفاصيل المتكررة."],
["التثبيت وبنية المشروع","من الصفر إلى أول صفحة",[
["المتطلبات",B,["PHP وComposer (مدير الحزم)","قاعدة بيانات مثل MySQL أو SQLite","بديل سهل: Laravel Herd أو Sail"]],
["خطوات التثبيت",G,["أنشئ المشروع: <code>composer create-project laravel/laravel app</code>","ادخل المجلد: <code>cd app</code>","شغّل الخادم: <code>php artisan serve</code>","افتح المتصفح: <code>localhost:8000</code>"],1],
["أهم المجلدات",P,["<code>app/</code> النماذج والمتحكمات","<code>routes/</code> ملفات المسارات","<code>resources/views/</code> قوالب Blade","<code>database/</code> الهجرات والبيانات التجريبية"]],
["ملف .env",O,["يحوي إعدادات قاعدة البيانات وكلمات السر","لا ترفعه إلى GitHub أبدًا"]]],
"استخدم Git من اليوم الأول ليسهل الرجوع لأي نسخة.","بعد التثبيت تظهر صفحة ترحيب جاهزة تؤكد أن كل شيء يعمل."],
["المسارات والمتحكمات","Routing & Controllers",[
