<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laravel : formation complète</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf5;--paper:#fdfdfb;--line:#dbe3f2;--ink:#14235c;--txt:#2b3557;--blue:#1f3fa0;--green:#2e9e57;--orange:#ee8a1f;--purple:#6a3fb5;--red:#d6335b;--yel:#ffd93b;--note:#fff3a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1226;--paper:#182142;--line:#26325c;--ink:#dfe7ff;--txt:#c3cdee;--note:#6b5f1c}}
:root[data-theme="dark"]{--bg:#0c1226;--paper:#182142;--line:#26325c;--ink:#dfe7ff;--txt:#c3cdee;--note:#6b5f1c}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
header{text-align:center;padding:20px 16px 4px;position:relative}
header h1{margin:6px 0 0;color:var(--ink);font-size:clamp(22px,5vw,34px);font-weight:800}
header p{margin:4px 0 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg)}
nav a{flex:none;text-decoration:none;font-size:13px;font-weight:600;color:var(--ink);border:2px solid var(--blue);border-radius:99px;padding:2px 12px;background:var(--paper);display:flex;align-items:center;gap:8px;white-space:nowrap}
nav a:hover,nav a:focus-visible,nav a.on{background:var(--yel);color:#14235c;border-color:var(--orange)}
nav a b{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800}
nav a.on b{background:var(--orange)}
main{width:100%;margin:0;padding:8px 14px 40px;display:grid;gap:28px}
.page{position:relative;background:var(--paper);border-radius:10px;padding:22px 44px 22px 20px;box-shadow:0 2px 0 var(--line),0 10px 24px rgba(20,35,92,.12);background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
.page:before{content:"";position:absolute;top:10px;bottom:10px;right:10px;width:16px;background:radial-gradient(circle at 50% 50%,var(--ink) 0 4px,transparent 5px) 0 0/16px 26px repeat-y}
.page h2{margin:2px 0 0;color:var(--ink);font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.35;display:inline;background:linear-gradient(transparent 62%,var(--yel) 62% 92%,transparent 92%)}
.sub{margin:6px 0 14px;font-weight:600;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.blk{background:var(--paper);border:2px dashed var(--c);border-radius:12px;padding:12px 14px;margin-top:14px}
.blk h3{display:inline-block;margin:-26px 0 6px;padding:0 12px;background:var(--c);color:#fff;border-radius:6px;font-size:15px;font-weight:800;transform:rotate(-1deg)}
.blk ul,.blk ol{margin:0;padding:0 18px 0 0}
.blk li{margin:3px 0}
.blk li::marker{color:var(--c);font-weight:800}
.il{list-style:none;padding:0!important}
.il li{display:flex;gap:8px;align-items:flex-start}
.ib{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--paper));font-size:18px;transition:transform .25s}
.il li:hover .ib{transform:scale(1.2) rotate(-8deg)}
.flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 2px;margin-top:6px}
.st{flex:1 1 92px;min-width:92px;max-width:170px;text-align:center}
.ico{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 4px;border-radius:16px;background:color-mix(in srgb,var(--c) 14%,var(--paper));border:2px solid var(--c);font-size:30px;transition:transform .25s}
.st:hover .ico{transform:translateY(-4px) rotate(-6deg) scale(1.08)}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:800}
.st b{display:block;font-size:12.5px;line-height:1.4;color:var(--ink);margin-top:2px}
.ar{align-self:center;margin-top:-30px;color:var(--c);font-style:normal;font-size:14px}
.note,.end{margin-top:14px;padding:10px 14px;border-radius:6px;font-weight:600}
.note{background:var(--note);color:var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.12);width:fit-content;max-width:100%}
.end{border:2px solid var(--blue);border-radius:12px;color:var(--ink)}
.end b{color:var(--blue)}
footer{text-align:center;padding:20px;font-weight:600;color:var(--ink)}
.cap{font-weight:700;margin:18px 0 6px;color:var(--ink);border-inline-start:4px solid var(--green);padding-inline-start:10px}
.ex{border-inline-start:5px solid var(--green);padding:8px 14px;background:var(--paper);border-radius:8px;margin:10px 0}
.win{background:#0f1424;border-radius:12px;margin:8px 0;overflow:hidden;direction:ltr;text-align:left}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px 5px 12px;background:rgba(255,255,255,.08);color:#9aa3c7;font:600 12px ui-monospace,Consolas,monospace}
.wh button{font:700 12px Cairo,sans-serif;border:0;border-radius:8px;padding:3px 12px;background:var(--yel);color:#14235c;cursor:pointer}
.win pre{margin:0;padding:12px 14px;color:#e6eaff;overflow-x:auto;font:13px/1.65 ui-monospace,Consolas,monospace;white-space:pre}
.dig{margin-top:14px;border:2px solid var(--purple);border-radius:12px;background:var(--paper);overflow:hidden}
.dig summary{cursor:pointer;padding:8px 14px;font-weight:800;color:var(--purple);list-style:none;display:flex;align-items:center;gap:8px}
.dig summary::-webkit-details-marker{display:none}
.dig summary:after{content:"＋";margin-inline-start:auto;transition:transform .3s}
.dig[open] summary:after{transform:rotate(45deg)}
.dig>div,.dig>ul,.dig>p{padding:4px 16px 12px}
.dig ul{margin:0;padding:4px 34px 12px 16px}
.dig li{margin:4px 0}
.dig li::marker{color:var(--purple)}
.dig svg{width:min(460px,100%);display:block;margin:6px auto}
.qz{margin-top:14px;border:2px solid var(--green);border-radius:12px;padding:10px 14px;background:var(--paper)}
.qz b{color:var(--ink)}
.qz button{font:inherit;display:block;width:100%;text-align:start;margin:6px 0;padding:4px 12px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--txt);cursor:pointer}
.qz button.g{background:#d7f5e0;border-color:var(--green);color:#14532d}
.qz button.x{background:#fde1e7;border-color:var(--red);color:#7f1d1d}
.qf{font-weight:800;color:var(--ink)}
code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:color-mix(in srgb,var(--blue) 12%,var(--paper));border-radius:6px;padding:1px 6px;word-break:break-word}
.pgl{margin:8px auto 0;max-width:420px;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.pgl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .5s}
.lg{position:absolute;top:12px;left:12px;z-index:10;border:2px solid var(--blue);background:var(--yel);color:#14235c;border-radius:99px;padding:2px 14px;font:800 14px Cairo,sans-serif;cursor:pointer}
html[dir=ltr] .lg{left:auto;right:12px}
html[dir=ltr] .page{padding:22px 20px 22px 44px}
html[dir=ltr] .page:before{right:auto;left:10px}
html[dir=ltr] .blk ul,html[dir=ltr] .blk ol{padding:0 0 0 18px}
html[dir=ltr] .dig ul{padding:4px 16px 12px 34px}
html[dir=ltr] #top{left:auto;right:16px}
#art svg{width:min(760px,100%);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 12px 24px rgba(20,35,92,.16))}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:4px;z-index:9;background:linear-gradient(90deg,var(--blue),var(--yel));transform-origin:right;transform:scaleX(0);background-size:200% 100%;animation:sh 3s linear infinite}
html[dir=ltr] #bar{transform-origin:left}
@keyframes sh{to{background-position:-200% 0}}
#top{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);background:var(--yel);color:#14235c;font-size:20px;cursor:pointer;z-index:8;opacity:0;pointer-events:none;transform:scale(.6);transition:.3s}
#top.show{opacity:1;pointer-events:auto;transform:none}
.js .page{opacity:0;transform:translateY(36px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .page.in{opacity:1;transform:none}
.js .blk{opacity:0;transform:translateY(22px) scale(.97);transition:opacity .5s,transform .5s;transition-delay:calc(var(--k)*90ms + 250ms)}
.js .in .blk{opacity:1;transform:none}
.js .in .blk:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 8px 18px rgba(20,35,92,.15)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .page,.js .blk,#bar{animation:none;transition:none;opacity:1;transform:none}}
@media (min-width:900px){
  html{scroll-padding-top:16px}
  body{padding-right:250px}
  nav{position:fixed;top:0;right:0;bottom:0;width:250px;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;gap:6px;padding:20px 14px;background:var(--paper);border-left:2px solid var(--line);z-index:7}
  nav:before{content:attr(data-t);font-weight:800;color:var(--ink);font-size:18px;padding:0 4px 6px}
  nav a{border-radius:10px;padding:7px 12px;border-color:transparent;background:transparent;white-space:normal;line-height:1.4}
  nav a.on{border-color:var(--orange);background:var(--paper)}
  nav a:hover{transform:translateX(-4px)}
  html[dir=ltr] body{padding:0 0 0 250px}
  html[dir=ltr] nav{right:auto;left:0;border-left:0;border-right:2px solid var(--line)}
  html[dir=ltr] nav a:hover{transform:translateX(4px)}
}
</style>
</head>
<body>
<button class="lg" id="lg"></button>
<header>
  <div id="art"></div>
  <h1 id="h1"></h1>
  <p id="sb" style="font-weight:600"></p>
  <div class="pgl"><i id="pb"></i></div>
  <p id="pt" style="font-size:14px"></p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="ft"></footer>
<button id="top" aria-label="Top">↑</button>
<div id="bar"></div>
<script>
/* ==== helpers ==== */
const R=String.raw;
const $=i=>document.getElementById(i);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let L=0; try{L=localStorage.getItem('lrv')=='fr'?1:0}catch(e){}
let done={}; try{done=JSON.parse(localStorage.getItem('lrvd')||'{}')}catch(e){}
const x=s=>{const i=s.indexOf('§');return i<0?s:(L?s.slice(i+1):s.slice(0,i))};
const codes=[];
const reg=c=>{codes.push(c);return codes.length-1};
const win=(n,c,i)=>`<div class="win"><div class="wh"><span>${n}</span><button type="button" data-cp="${i}">${L?'Copier':'نسخ'}</button></div><pre>${esc(c)}</pre></div>`;
const CL=['--blue','--green','--orange','--purple','--red'];

/* ==== SVG flow ==== */
const flow=items=>{
  const n=items.length, g=420/n;
  let o=`<svg viewBox="0 0 420 128" role="img" aria-hidden="true">`;
  items.forEach(([e,l],i)=>{
    const px=420-g*(i+.5), c=`var(${CL[i%5]})`;
    o+=`<rect x="${px-30}" y="14" width="60" height="60" rx="14" fill="${c}" fill-opacity=".15" stroke="${c}" stroke-width="2"/>`;
    o+=`<text x="${px}" y="54" text-anchor="middle" font-size="28">${e}</text>`;
    o+=`<text x="${px}" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${l}</text>`;
    if(i<n-1){
      const x2=px-g+36;
      o+=`<line x1="${px-36}" y1="44" x2="${x2}" y2="44" stroke="var(--ink)" stroke-width="2"/>`;
      o+=`<polygon points="${x2},40 ${x2+6},44 ${x2},48" fill="var(--ink)"/>`;
    }
  });
  return o+'</svg>';
};
const SVGS=[
  flow([['🌐','Req'],['🛣️','Route'],['🎮','Ctrl'],['🗄️','Model'],['🖼️','View']]),
  flow([['📦','Composer'],['🏗️','create'],['⚙️','.env'],['🚀','serve']]),
  flow([['🛣️','Route'],['🛡️','Valid'],['🎮','Ctrl'],['↩️','Resp']]),
  flow([['📄','Blade'],['⚙️','Compile'],['🌐','HTML'],['👤','Browser']]),
  flow([['📐','Migration'],['🗄️','Table'],['🧩','Model'],['🔗','Rel']]),
  flow([['🧩','Model'],['🔍','Query'],['🔗','Relations'],['📊','Result']]),
  flow([['🌐','Req'],['🔐','auth'],['🛂','Policy'],['🎮','Ctrl']]),
  flow([['📱','App'],['🔑','Token'],['🛣️','api.php'],['🧾','JSON']]),
  flow([['✅','Test'],['🧪','CI'],['⚙️','optimize'],['🚀','Prod']]),
  flow([['🐘','PHP'],['🛣️','Laravel'],['🗄️','Eloquent'],['🔐','Auth'],['🚀','Deploy']])
];

/* ==== hero ==== */
const HERO=`<svg viewBox="0 0 760 250" role="img" aria-label="Laravel" direction="ltr">
<defs>
  <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182142"/><stop offset="1" stop-color="#263b74"/></linearGradient>
  <linearGradient id="lred" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff756b"/><stop offset="1" stop-color="#f9322c"/></linearGradient>
</defs>
<rect x="8" y="8" width="744" height="234" rx="30" fill="url(#lbg)"/>
<circle cx="635" cy="125" r="88" fill="#fff" fill-opacity=".07"/>
<circle cx="635" cy="125" r="69" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
<g transform="translate(577 67)" fill="none" stroke="url(#lred)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 12v92l41 24 40-24V12L51 36 10 12Z"/>
  <path d="m10 58 41 24 40-24M51 36v46m0 46V82l40-24"/>
  <path d="m91 12 40 24v47l-40 24"/>
</g>
<text x="62" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">THE PHP FRAMEWORK</text>
<text x="60" y="181" fill="#fff" font-family="Arial,sans-serif" font-size="72" font-weight="800">Laravel <tspan fill="#ff5a52">13</tspan></text>
<path d="M62 204h280" stroke="#ff5a52" stroke-width="5" stroke-linecap="round"/>
<circle cx="360" cy="204" r="5" fill="#ff5a52"/>
</svg>`;

/* ==== data ==== */
const CH=[
/* 1 — Intro */
{
  t:"ما هو Laravel؟§Qu'est-ce que Laravel ?",
  s:"Laravel Framework — إطار عمل PHP للويب§Laravel Framework — le framework PHP du web",
  b:[
    ["تعريف Laravel§Définition","blue",[
      "إطار عمل مفتوح المصدر مبني على PHP لبناء مواقع وتطبيقات ويب منظمة وسريعة§Framework open-source basé sur PHP pour des sites et applications web organisés et rapides",
      "يعتمد نمط MVC ويوفر أدوات جاهزة: توجيه، قواعد بيانات، مصادقة، طوابير§Suit le pattern MVC et fournit routing, base de données, auth, queues prêts à l'emploi"
    ]],
    ["لماذا يحبه المطورون؟§Pourquoi les devs l'adorent","green",[
      "صياغة واضحة ومقروءة§Syntaxe claire et lisible",
      "توثيق ممتاز ومجتمع كبير§Documentation excellente et grande communauté",
      "أداة Artisan توفر الوقت§Artisan fait gagner du temps",
      "منظومة متكاملة: Livewire وInertia وSanctum§Écosystème : Livewire, Inertia, Sanctum"
    ]],
    ["ماذا تبني به؟§Que construire avec ?","orange",[
      "مواقع ومتاجر إلكترونية§Sites et e-commerce",
      "لوحات تحكم وأنظمة إدارة§Backoffices et systèmes de gestion",
      "واجهات API للتطبيقات§APIs pour applications",
      "أنظمة حجز وخدمات SaaS§Systèmes de réservation et SaaS"
    ]],
    ["دورة الطلب§Cycle d'une requête","purple",[
      "الطلب يصل§La requête arrive",
      "المسار يحدد الوجهة§La route choisit la destination",
      "المتحكم ينفذ المنطق§Le controller exécute la logique",
      "النموذج يجلب البيانات§Le model récupère les données",
      "العرض ينتج الصفحة§La view produit la page"
    ],true]
  ],
  n:"Laravel لا يغني عن PHP جيد: كلما أتقنت الأساسيات فهمت الإطار أسرع.§Laravel ne remplace pas un bon PHP : maîtrisez les bases et vous comprendrez le framework plus vite.",
  e:"يمنحك Laravel هيكلًا جاهزًا لتركز على فكرة مشروعك لا على التفاصيل المتكررة.§Laravel vous donne une structure prête pour vous concentrer sur l'idée, pas le boilerplate.",
  d:[
    "الإطار يفرض هيكلًا ويستدعي كودك، أما المكتبة فتستدعيها أنت متى شئت.§Le framework impose une structure et appelle votre code ; une bibliothèque s'appelle quand vous voulez.",
    "المكونات تعمل معًا عبر حاوية الخدمات التي تدير الاعتمادات تلقائيًا.§Les composants coopèrent via le Service Container qui gère les dépendances automatiquement.",

  v:0

/* 2 — Installation + pratique 1 */
{
  t:"التثبيت وبنية المشروع§Installation et structure",

    ["خطوات التثبيت§Étapes d'installation","green",[

  ],
  n:"استخدم Git من اليوم الأول ليسهل الرجوع لأي نسخة.§Utilisez Git dès le premier jour pour pouvoir revenir à toute version.",
  e:"بعد التثبيت تظهر صفحة ترحيب جاهزة تؤكد أن كل شيء يعمل.§Après l'installation, une page d'accueil confirme que tout fonctionne.",
  d:[
    "<code>public/index.php</code> نقطة الدخول؛ اجعل جذر الخادم يشير إلى public فقط.§<code>public/index.php</code> est le point d'entrée ; le root du serveur doit pointer uniquement vers public.",

    "راجع متطلبات الإصدار الحالي في التوثيق قبل التثبيت.§Vérifiez les prérequis de la version actuelle dans la doc avant d'installer."
  ],
  v:1,
  pr:{
    p:"تحتاج PHP وComposer؛ تحقق من الإصدار المطلوب في التوثيق الرسمي.§Il vous faut PHP et Composer ; vérifiez la version requise dans la documentation officielle.",
    c:R`composer create-project laravel/laravel blog
cd blog
php artisan serve`,
    f:[["routes/web.php",R`<?php

/* ==== icon matcher ==== */
const IC=[[/Route|مسار/i,'🛣️'],[/Controller|متحكم/i,'🎮'],[/Blade|View|قالب|vue/i,'🖼️'],[/Eloquent|Migration|Model|نموذج|جدول|قاعدة/i,'🗄️'],[/artisan|Composer/i,'⌨️'],[/CSRF|أمان|مصادقة|Auth|Sanctum|Breeze/i,'🔐'],[/API/,'🔌'],[/اختبار|Test|Pest/i,'✅'],[/نشر|Deploy/i,'🚀'],[/طلب|Req/i,'🌐'],[/تحقق|Valid/i,'🛡️'],[/علاق|Relation/i,'🔗'],[/استعلام|Query/i,'🔍']];
const ic=t=>{for(const[r,e]of IC)if(r.test(t))return e;return null};

/* ==== progress / quiz ==== */
const TQ=CH.filter(c=>c.pr).length;
function prog(){
  const n=Object.keys(done).length;
  $('pb').style.width=Math.min(n/TQ,1)*100+'%';
  $('pt').textContent=(L?'Étapes validées : ':'الخطوات المنجزة: ')+n+'/'+TQ;
}
function qa(b,ok,n){
  b.classList.add(ok?'g':'x');
  b.parentNode.querySelector('.qf').textContent=ok?(L?'✔ Bravo !':'✔ أحسنت!'):(L?'✖ Réessayez':'✖ حاول مرة أخرى');
  if(ok){done[n+1]=1;try{localStorage.setItem('lrvd',JSON.stringify(done))}catch(e){}prog()}
}
window.qa=qa;

/* ==== render ==== */
function render(){
  codes.length=0;
  const H=document.documentElement;
  H.lang=L?'fr':'ar'; H.dir=L?'ltr':'rtl';
  document.title=L?'Laravel : formation complète':'Laravel: تكوين شامل';
  $('h1').textContent=x('تعلّم Laravel: من الفكرة إلى أول تطبيق§Apprenez Laravel : de l\'idée à votre première application');
  $('sb').textContent=x('مسار متكامل: مفاهيم، أوامر، كود كامل، تحديات مصححة§Un parcours complet : concepts, commandes, code complet, défis corrigés');
  $('lg').textContent=L?'ع':'FR';
  $('ft').textContent='Mezni Dhiaa | Smart Formation';
  $('art').innerHTML=HERO;

  const nav=$('nav'),main=$('main');
  nav.dataset.t=x('المواضيع§Sommaire');
  nav.innerHTML='';main.innerHTML='';
  nav.insertAdjacentHTML('beforeend',`<a href="index.html"><span>${x('العودة إلى الصفحة الرئيسية§Retour à l’accueil')}</span></a>`);

  CH.forEach((c,n)=>{
    const id='p'+(n+1);
    nav.insertAdjacentHTML('beforeend',`<a href="#${id}"><b>${n+1}</b><span>${x(c.t)}</span></a>`);

    // concept blocks
    const blocks=c.b.map(([h,col,items,isFlow],k)=>{
      let body;
      if(isFlow){
        body=`<div class="flow">${items.map((it,j)=>{
          const label=x(it);
          return `<div class="st" style="--i:${j}"><span class="ico">${ic(label)||'⭐'}</span><span class="num">${j+1}</span><b>${label}</b></div>`;
        }).join('<i class="ar">◀</i>')}</div>`;
      } else {
        body=`<ul class="il">${items.map(it=>{
          const label=x(it);
          return `<li><span class="ib">${ic(label)||'✦'}</span><span>${label}</span></li>`;
        }).join('')}</ul>`;
      }
      const hi=ic(x(h));
      return `<section class="blk" style="--c:var(--${col});--k:${k}"><h3>${hi?hi+' ':''}${x(h)}</h3>${body}</section>`;
    }).join('');

    // deep dive
    let deep='';
    if(c.d){
      deep=`<details class="dig"><summary>🔎 ${L?'Pour aller plus loin':'تعمّق أكثر'}</summary><div>${SVGS[c.v]||''}<ul>${c.d.map(d=>`<li>${x(d)}</li>`).join('')}</ul></div></details>`;
    }

    // practice
    let prac='';
    if(c.pr){
      const p=c.pr;
      const files=p.f.map(([nm,cd])=>win(nm,cd,reg(cd))).join('');
      prac=`
        <div class="cap">${L?'🧪 Atelier pratique':'🧪 ورشة تطبيقية'}</div>
        <div class="note">📌 ${x(p.p)}</div>
        <div class="cap">${L?'⌨️ Commandes':'⌨️ الأوامر'}</div>${win('terminal',p.c,reg(p.c))}
        <div class="cap">${L?'📄 Code complet':'📄 الكود الكامل'}</div>${files}
        <div class="ex">👀 <b>${L?'Résultat attendu : ':'النتيجة المتوقعة: '}</b>${x(p.x)}</div>
        <details class="dig"><summary>🎯 ${L?'Défi à faire seul':'تحدٍّ بمفردك'}</summary><div><p>${x(p.ch[0])}</p><details class="dig"><summary>✅ ${L?'Voir la correction':'عرض الحل'}</summary><div>${win('solution',p.ch[1],reg(p.ch[1]))}</div></details></div></details>
        <div class="qz"><b>🧠 ${x(p.qz[0])}</b>${p.qz[1].map((o,i)=>`<button onclick="qa(this,${i==p.qz[2]},${n})">${x(o)}</button>`).join('')}<div class="qf"></div></div>
        <section class="blk" style="--c:var(--red)"><h3>⚠️ ${L?'Erreurs fréquentes':'أخطاء شائعة'}</h3><ul class="er">${p.er.map(e=>`<li><b>${x(e[0])}</b> ← ${x(e[1])}</li>`).join('')}</ul></section>
      `;
    }

    main.insertAdjacentHTML('beforeend',`
      <article class="page" id="${id}">
        <h2>${n+1}. ${x(c.t)}</h2>
        <p class="sub">${x(c.s)}</p>
        <div class="grid">${blocks}</div>
        ${c.n?`<div class="note">💡 ${x(c.n)}</div>`:''}
        ${c.e?`<div class="end"><b>${L?'En résumé : ':'الخلاصة: '}</b>${x(c.e)}</div>`:''}
        ${deep}
        ${prac}
      </article>
    `);
  });

  // copy
  main.querySelectorAll('[data-cp]').forEach(b=>{
    b.onclick=()=>{
      try{
        navigator.clipboard.writeText(codes[+b.dataset.cp]);
        const t=b.textContent;
        b.textContent=L?'Copié':'تم';
        setTimeout(()=>b.textContent=t,1200);
      }catch(e){}
    };
  });

  // observers
  const pages=main.querySelectorAll('.page');
  if('IntersectionObserver' in window){
    const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.06});
    pages.forEach(p=>o.observe(p));
    const links=[...nav.querySelectorAll('a')];
    const so=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(a=>{
          const on=a.getAttribute('href')==='#'+e.target.id;
          a.classList.toggle('on',on);
          if(on)a.scrollIntoView({block:'nearest',inline:'nearest'});
        });
      }
    }),{rootMargin:'-30% 0px -60% 0px'});
    pages.forEach(p=>so.observe(p));
  } else pages.forEach(p=>p.classList.add('in'));

  prog();
}

/* ==== chrome ==== */
$('lg').onclick=()=>{L=1-L;try{localStorage.setItem('lrv',L?'fr':'ar')}catch(e){}render()};
document.documentElement.classList.add('js');

/* scroll UI */
const tb=$('top');
tb.onclick=()=>scrollTo({top:0});
addEventListener('scroll',()=>{
  tb.classList.toggle('show',scrollY>600);
  const h=document.documentElement;
  $('bar').style.transform=`scaleX(${h.scrollTop/(h.scrollHeight-h.clientHeight||1)})`;
},{passive:true});

render();
</script>
