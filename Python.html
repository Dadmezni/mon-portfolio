<html lang="fr"><head><meta charset="utf-8">

<title>Python — Les bases du développement</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#161c2d;--mu:#667085;--pr:#4f46e5;--pr2:#eef2ff;--bd:#e4e7ee;--ok:#16a34a;--ko:#dc2626;--code:#0f1424;--ct:#e6eaff;--dm:#fff7e0;--hl:#fde68a;--l0:#16a34a;--l1:#2563eb;--l2:#9333ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e111b;--card:#171b29;--tx:#eef0f8;--mu:#9aa3b8;--pr:#8b85ff;--pr2:#232748;--bd:#272c40;--code:#090c16;--dm:#2a2616;--hl:#5b4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem}.logo span{background:var(--pr);color:#fff;border-radius:9px;padding:5px 7px;display:flex}
.sp{flex:1}.pg{width:150px;height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--ok));transition:width .7s}
.lay{display:grid;grid-template-columns:270px 1fr;gap:22px;max-width:1100px;margin:0 auto;padding:22px 18px 70px}
nav{align-self:start;position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
.lv{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:14px 0 4px;color:var(--c)}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:.93rem}
.it:hover,.it.on{background:var(--pr2)}.it.on{font-weight:700;box-shadow:inset 3px 0 var(--pr)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.7rem;flex:none;color:var(--mu)}.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.mb{display:none;width:100%;margin-bottom:10px;justify-content:center;gap:8px}
main{min-width:0;animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bdg{background:var(--c);color:#fff;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700}
h1{font-size:1.8rem;line-height:1.2;margin:8px 0 12px;display:flex;align-items:center;gap:14px}
.tile{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--c),var(--pr));color:#fff;display:grid;place-items:center;flex:none;animation:fl 3s ease-in-out infinite}.tile svg{width:28px;height:28px}
@keyframes fl{50%{transform:translateY(-5px) rotate(-4deg)}}
.steps{display:flex;gap:4px;margin:12px 0 18px;overflow-x:auto}
.sb{flex:1;min-width:84px;border:0;border-bottom:4px solid var(--bd);background:none;color:var(--mu);padding:6px 2px;font:inherit;font-size:.78rem;cursor:pointer}
.sb.on{border-color:var(--c);color:var(--tx);font-weight:700}.sb.p{border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0;animation:in .4s both}
.obj{background:var(--pr2);border-radius:12px;padding:10px 16px;margin-top:12px}.obj li{margin:2px 0}
mark{background:var(--hl);color:inherit;padding:0 4px;border-radius:4px;font-weight:600}
code{background:var(--pr2);padding:1px 6px;border-radius:5px}
.fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.fl b{background:var(--pr2);border:2px solid var(--bd);border-radius:12px;padding:8px 14px;animation:hi 3.6s infinite;animation-delay:calc(var(--k)*.9s)}
.fl u{text-decoration:none;color:var(--mu)}
@keyframes hi{0%,24%,100%{border-color:var(--bd);transform:none}6%,18%{border-color:var(--c);background:var(--hl);transform:scale(1.08)}}
.nt{display:flex;gap:12px;margin:10px 0;animation:pop .45s}.nt>span{font-size:.85rem;background:var(--c);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:2px}
.win{background:var(--code);border-radius:14px;overflow:hidden;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.wh{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(255,255,255,.06);color:#9aa3c7;font-size:.8rem}
.wh b{width:10px;height:10px;border-radius:50%;background:#ff5f57}.wh b+b{background:#febc2e}.wh b+b+b{background:#28c840}.wh em{font-style:normal;margin-left:8px}
pre{margin:0;padding:14px;color:var(--ct);overflow-x:auto;font:.9rem/1.6 ui-monospace,Menlo,Consolas,monospace}pre i{font-style:normal}.c{color:#7a85ad}.s{color:#9be28f}.k{color:#ff92c2}.n{color:#ffcf7a}
.demo{background:var(--dm);border:1px solid var(--bd);border-radius:14px;padding:16px}.demo>b{display:block;margin-bottom:10px}
input,select{font:inherit;padding:8px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
.bt{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.bt:active{transform:scale(.96)}.bt.g{background:none;color:var(--tx);border:1px solid var(--bd)}
.out{margin-top:12px;min-height:2.4rem;font-size:1.2rem;word-break:break-word}
.box{display:inline-block;border:3px dashed var(--pr);border-radius:12px;padding:10px 18px;margin:4px;text-align:center}
.pop{animation:pop .45s}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.chip{display:inline-block;background:var(--pr);color:#fff;border-radius:99px;padding:3px 12px;margin:3px;font-size:1rem;animation:pop .4s}
.tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.err{border-left:4px solid var(--ko);padding:8px 14px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}
.ok2{border-left:4px solid var(--ok);padding:8px 14px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}
button.o{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.good{background:#dcfce7!important;border-color:var(--ok)!important;color:#14532d!important}.bad{background:#fee2e2!important;border-color:var(--ko)!important;color:#7f1d1d!important;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.cert{border:3px double var(--pr);border-radius:18px;padding:30px 18px;text-align:center;background:var(--card)}
@media (max-width:860px){.lay{grid-template-columns:1fr}.mb{display:flex}nav{display:none;position:static}nav.open{display:block}h1{font-size:1.45rem}.pg{width:90px}}
@media print{header,nav,.pn,.noprint{display:none!important}.lay{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
