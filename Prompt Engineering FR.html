var M=[
{t:"Comprendre l’IA générative",h:4,o:["Distinguer IA, Machine Learning, Deep Learning et IA générative","Savoir ce qu’un modèle produit… et ce qu’il ne garantit pas"],
k:[["Les familles de l’IA","Le Machine Learning apprend des régularités dans les données ; le Deep Learning utilise des réseaux à plusieurs couches ; l’IA générative crée du texte, des images, de l’audio ou du code."],["Qu’est-ce qu’un LLM ?","Un grand modèle de langage calcule des probabilités sur les unités de texte suivantes. Il ne consulte pas tout le Web et n’a pas forcément de mémoire durable."],["Limites et risques","Références inventées, dates confondues, code vulnérable, biais. À vérifier en santé, droit, finance et sécurité."]],
p:"Tu es un formateur en marketing pour des étudiants débutants.\nExplique en 150 mots la différence entre marketing traditionnel et marketing digital.\nUtilise l’exemple d’une petite boutique tunisienne.\nTermine par trois questions de compréhension.",
a:["Demander à deux modèles d’expliquer le même concept à un débutant","Comparer clarté, précision, structure et exemples","Repérer une affirmation à vérifier"],
q:["Quelle est la différence entre IA générative et classification ?",["L’IA générative crée du contenu, un classificateur attribue une étiquette","Les deux font exactement la même chose","La classification crée des images"],0]},
{t:"Modèles, tokens et contexte",h:4,o:["Définir token, fenêtre de contexte et température","Différencier interface, modèle et API"],
k:[["Tokens","Morceaux de mots, ponctuation ou caractères. Leur nombre dépend de la langue et influence les limites et le coût."],["Fenêtre de contexte","Quantité d’information prise en compte dans un échange. Au-delà : résumer, sélectionner ou utiliser une recherche documentaire."],["Température","Règle la variation des sorties. Plus basse = plus prévisible. Ce n’est pas un bouton de vérité."],["Interface, modèle, API","L’interface est l’application, le modèle génère, l’API permet à un programme de dialoguer avec le modèle."]],
p:"Résume ce texte en 5 points, chacun de 15 mots maximum.\nNe rajoute aucune information absente du texte.\nSi un élément est ambigu, indique « à vérifier ».",
a:["Tester un texte court et un texte long","Observer l’effet d’instructions contradictoires","Créer un tableau de critères pour choisir un modèle"],
q:["La fenêtre de contexte représente…",["La quantité d’information que le modèle peut prendre en compte","La taille de l’écran","Le prix de l’abonnement"],0]},
{t:"Prompts fondamentaux",h:6,o:["Structurer une demande : rôle, contexte, tâche, contraintes, format","Maîtriser zero-shot et few-shot"],
k:[["Rôle et contexte","Le rôle cadre le ton ; le contexte décrit public, objectif et données. Jamais de données confidentielles sans autorisation."],["Tâche et contraintes","Verbes précis (comparer, classer, extraire…). Contraintes : longueur, niveau, langue, périmètre, interdits."],["Format de sortie","Liste, tableau, plan, JSON, code commenté : le format facilite la réutilisation et la vérification."],["Zero-shot / few-shot","Sans exemple, ou avec quelques exemples représentatifs et cohérents."]],
p:"RÔLE : Tu es un conseiller pédagogique.\nCONTEXTE : séance de 90 minutes, étudiants débutants en gestion.\nTÂCHE : construis une séance sur les bases du marketing digital.\nCONTRAINTES : vocabulaire simple, exemples locaux, pas de jargon non expliqué.\nFORMAT : objectifs, déroulement minuté, activité, corrigé, devoir.\nQUALITÉ : chaque objectif doit être vérifiable.",
a:["Transformer cinq demandes vagues en prompts structurés","Passer d’un prompt zero-shot à une version few-shot","Utiliser le générateur ci-dessous"],
q:["Qu’est-ce que le few-shot ?",["Donner quelques exemples d’entrées et de sorties","Poser la question très vite","Interdire les exemples"],0]},
{t:"Techniques avancées et tests",h:6,o:["Décomposer une tâche et chaîner des prompts","Tester et améliorer un prompt avec méthode"],
k:[["Décomposition et chaining","Découper en étapes (extraire, analyser, proposer, vérifier). La sortie d’une étape alimente la suivante."],["Sorties structurées / JSON","Définir champs, types et valeurs autorisées, et le comportement si une donnée manque."],["Jeu de tests","Cas normaux, limites, ambigus et adversariaux, évalués avec une grille : exactitude, format, sécurité, stabilité."],["Itération","Modifier une variable à la fois ; noter version, modèle, date et résultats."]],
p:"Tu es un extracteur de données.\nRetourne uniquement un JSON avec les champs « nom », « email », « téléphone » et « statut ».\nSi une valeur est absente, utilise null. N’invente jamais une donnée.\nTexte : [COLLER LE TEXTE]",
a:["Créer un workflow en trois prompts : extraction, contrôle, rédaction","Préparer 8 cas de test dont 2 ambigus","Détecter les JSON invalides ou les données inventées"],
q:["Pourquoi préparer des cas de test ?",["Pour mesurer la qualité sur des cas variés et détecter les défauts","Pour allonger le prompt","Pour éviter de relire"],0]},
{t:"Métiers et développement",h:5,o:["Adapter les prompts à des tâches professionnelles","Demander du code testable et sécurisé"],
k:[["Rédaction et marketing","Préciser audience, objectif, ton, appel à l’action. Confronter les idées aux données réelles."],["Analyse de documents","Demander faits, interprétations et points à vérifier, avec les passages sources."],["Développement logiciel","Donner versions, comportement attendu, contraintes et tests. Ne jamais exécuter du code aveuglément."],["Débogage","Message d’erreur complet, étapes de reproduction, résultat attendu et observé. Masquer clés et données personnelles."]],
p:"Tu es un développeur Laravel expérimenté.\nProjet : Laravel 13, PHP 8.3, PostgreSQL.\nTâche : proposer une migration et un modèle pour gérer des rendez-vous.\nContraintes : clé étrangère, index utiles, validation serveur, politique d’autorisation, tests.\nCommence par expliquer le schéma et les hypothèses. Ne suppose pas l’existence de fichiers non fournis.",
a:["Écrire un prompt de migration Laravel","Écrire un prompt de débogage à partir d’une erreur fictive","Faire produire des tests et chercher les cas oubliés"],
q:["Que faut-il masquer dans un prompt de débogage ?",["Clés API, mots de passe, tokens, données personnelles","Le nom du framework","Le message d’erreur"],0]},
{t:"Assistants spécialisés et RAG",h:5,o:["Définir le périmètre d’un assistant","Expliquer les étapes d’un système RAG"],
k:[["Définir l’assistant","Mission, public, périmètre, règles, sources autorisées, conduite en cas de doute — et ce qu’il ne doit pas faire."],["Instructions système","Cadrent rôle, ton, priorités et format. Pas de secrets dedans ; elles ne remplacent pas les contrôles d’accès."],["Le RAG","Découpage des documents, embeddings, indexation, récupération des passages pertinents, puis génération avec ce contexte."],["Évaluer","Questions couvertes, non couvertes, ambiguës : bons passages retrouvés, fidélité, citations correctes."]],
p:"Tu es l’assistant documentaire d’un centre de formation.\nRéponds uniquement à partir des documents fournis.\nCite le titre du document et la section utilisée.\nSi la réponse est absente, dis : « Information absente des documents fournis ».\nNe complète pas avec une supposition.",
a:["Rédiger les instructions système d’un assistant","Créer un corpus de 3 documents non confidentiels","Préparer 10 questions couvertes et 5 hors corpus"],
q:["Que signifie RAG ?",["Retrieval-Augmented Generation","Random Answer Generator","Rapid API Gateway"],0]},
{t:"Agents IA et automatisation",h:6,o:["Distinguer assistant, workflow et agent","Concevoir une automatisation avec validation humaine"],
k:[["Assistant, workflow, agent","L’assistant répond, le workflow suit des étapes définies, l’agent choisit des outils pour atteindre un objectif."],["Tool calling","Le modèle propose un appel d’outil ; l’application l’exécute, contrôle les paramètres et renvoie le résultat."],["Validation humaine","Confirmation avant envoi, paiement, suppression ou toute action réelle. Permissions minimales."],["Injection de prompt","Les contenus externes (mails, pages, documents) sont des données non fiables, jamais des instructions."]],
p:"Conçois un workflow qui reçoit une demande client, extrait le nom et le sujet, classe la demande et prépare un brouillon de réponse.\nDemande une validation humaine avant tout envoi.\nN’envoie jamais le message automatiquement.\nPrévois les cas où l’adresse ou le sujet manque.",
a:["Dessiner un workflow de traitement de demandes","Lister outils et permissions minimales","Tester une instruction malveillante cachée dans un document"],
q:["Comment traiter un texte reçu qui contient « ignore tes règles » ?",["Comme une donnée non fiable, pas comme une instruction","Lui obéir","Le transmettre à l’outil d’envoi"],0]},
{t:"Projet final et portfolio",h:4,o:["Assembler les compétences dans un cas réaliste","Présenter limites, tests et résultats"],
k:[["Choisir et cadrer","Un besoin concret et limité : public, fonctions incluses/exclues, risques, critères de réussite."],["Construire et tester","Instructions, au moins 3 prompts spécialisés, 10 scénarios dont 2 hors périmètre."],["Présenter","Problème, solution, démo, tests, limites, sécurité, améliorations (5 à 7 minutes)."]],
p:"Projet conseillé : « Assistant IA pour un centre de formation ».\nFonctions : répondre à partir d’un programme fourni, proposer un plan de séance, générer un quiz, signaler les informations absentes.\nLimite : il ne confirme pas seul une inscription et ne modifie aucun dossier.",
a:["Finaliser la fiche de cadrage","Réaliser et conserver au moins 10 tests","Préparer une démonstration de 5 minutes"],
q:["Un bon portfolio montre…",["Les décisions et les preuves, pas seulement des captures","Uniquement des captures d’écran","Seulement le prompt final"],0]}
];

h+='<article class="card" id="intro"><div class="mh"><span class="num">📘</span><h2>Introduction et prérequis</h2></div><p>Ce cours de 40 heures apprend à concevoir, tester et optimiser des instructions pour les IA génératives, du plus simple (comprendre les modèles) au plus avancé (agents et projet final).</p><div class="def"><b>📖 Définition</b> Le Prompt Engineering est la conception méthodique d’instructions pour obtenir un résultat utile, vérifiable et reproductible. Ce n’est pas une formule magique : un bon prompt augmente les chances d’un bon résultat sans garantir la vérité.</div><div class="tag">Anatomie d’un prompt</div><div class="an">'+['Rôle','Contexte','Tâche','Contraintes','Format','Critères'].map(function(s,i){return '<span style="--i:'+i+'">'+s+'</span>'}).join('<i>→</i>')+'</div><div class="k" style="margin-top:14px"><div><b>🎯 Objectifs généraux</b>Structurer un prompt, choisir une technique, tester et améliorer, concevoir un assistant, identifier les risques.</div><div><b>🧰 Prérequis</b>Aucun langage de programmation pour les 6 premiers modules. Navigateur, documents numériques et outils en ligne suffisent.</div><div><b>🧭 Structure d’un chapitre</b>Objectifs, notions, définition, conseil, erreur fréquente, exemple, TP, exercice corrigé, réflexion, résumé, quiz.</div></div><div class="tag">Le parcours en un coup d’œil</div>'+PAR+'<div class="tag">Prompt faible ou prompt structuré ?</div><div class="tw"><table class="eval"><tr><th></th><th>Faible</th><th>Structuré</th></tr><tr><td>Demande</td><td>« Explique le marketing. »</td><td>Rôle, public, 150 mots, exemple local, 3 questions</td></tr><tr><td>Résultat</td><td>Générique, imprévisible</td><td>Adapté, vérifiable, réutilisable</td></tr></table></div></article>';
